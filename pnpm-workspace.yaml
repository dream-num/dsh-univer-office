packages:
  - 'packages/*'

# The bindings install transitively through their declared wrappers; hoisting
# them to the workspace root keeps them resolvable for the name-based build
# scripts and the NODE_PATH-spawned Gateway/Worker artifacts, whose bundles
# embed the wrapper code instead of resolving through a wrapper package.
publicHoistPattern:
  - '@univerjs-pro/engine-formula-rust-binding'
  - '@univerjs-pro/exchange-node-binding'

allowBuilds:
  esbuild: false
  protobufjs: false
  simple-git-hooks: false
minimumReleaseAgeExclude:
  - '@univerjs/*'
  - '@univerjs-pro/*'
  - '@univer-cli/*'
  - '@amamo/*'
  - '@deepseek-ai/dsh-agent@0.1.2-alpha.5 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.5 || 0.1.6-alpha.2'
