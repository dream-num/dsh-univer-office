name: Release to npm

run-name: Release ${{ inputs.version || github.ref_name }} to npm${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.2.0-alpha). Leave empty to use package.json.
        required: false
        type: string
      dry_run:
        description: Build and verify without publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dsh-univer-office-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # Input overrides package.json (e.g. re-publishing a bumped version).
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='${{ inputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Pack and inspect
        run: |
          npm pack --dry-run
          test -f dist/.npmignore || true

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"-"* ]]; then
            NPM_TAG="alpha"
          else
            NPM_TAG="latest"
          fi
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## Release ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry-run: ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- published: ${{ inputs.dry_run && 'no' || 'yes' }}" >> "$GITHUB_STEP_SUMMARY"
